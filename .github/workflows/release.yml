name: release

# Fires on:
#   - push to main          (build x64+arm64 matrix, upload artifacts; no public release)
#   - push of a v* tag      (build matrix, upload, publish a GitHub Release with both bundles)
#   - workflow_dispatch     (build matrix, upload; release only if dispatched on a tag)
#
# Non-tag builds use a 0.0.0-<short-sha> version so artifacts can be
# downloaded from the workflow run page for smoke-testing without
# publishing anything.
#
# Pipeline:
#   build-arm64-dll  builds vigemclient.arm64.dll from upstream
#                    nefarius/ViGEmClient source (no precompiled arm64
#                    binary is published by Nefarius).
#   build            matrix over [x64, arm64]. x64 uses the vendored
#                    src/vigemclient.x64.dll; arm64 pulls the artifact
#                    from build-arm64-dll. Produces DualSenseXBridge-<arch>.msi
#                    and DualSenseXBridge-<version>-<arch>.zip.
#   release          downloads both bundle zips and creates one release.
#                    Only runs on tag push (is_release output gate).
#
# Triggering a public release: git tag v1.1.0 && git push origin v1.1.0

on:
  push:
    branches: [main]
    tags:
      - 'v*.*.*'
  workflow_dispatch: {}

permissions:
  contents: write   # softprops/action-gh-release needs this (tag builds only)

env:
  # nefarius/ViGEmClient pinned ref. Update intentionally; bumping changes
  # the bundled native client lib for both arches.
  VIGEMCLIENT_REF: master

jobs:
  build-vigemclient:
    name: build vigemclient.dll (${{ matrix.arch }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            cmake_arch: x64
          - arch: arm64
            cmake_arch: ARM64
    steps:
      - name: checkout nefarius/ViGEmClient
        uses: actions/checkout@v4
        with:
          repository: nefarius/ViGEmClient
          ref: ${{ env.VIGEMCLIENT_REF }}
          submodules: recursive
          path: vigemclient-src

      - name: build ${{ matrix.cmake_arch }} dll via cmake
        shell: pwsh
        working-directory: vigemclient-src
        run: |
          # Upstream sln declares only x86/x64; use the CMake build with
          # the Visual Studio generator so the same recipe handles both
          # x64 and ARM64. -DViGEmClient_DLL=ON flips the target from
          # static lib to dll.
          $arch = '${{ matrix.cmake_arch }}'
          # Upstream's ViGEmClientShared target doesn't decorate functions
          # with __declspec(dllexport) and doesn't ship a .def file, so a
          # plain shared-lib build produces a DLL with zero public exports
          # ("Unable to find an entry point named 'vigem_alloc'"). Setting
          # CMAKE_WINDOWS_EXPORT_ALL_SYMBOLS=ON makes MSVC auto-export every
          # non-static public symbol -- equivalent to a generated .def.
          cmake -G "Visual Studio 17 2022" -A $arch `
                -DViGEmClient_DLL=ON `
                -DCMAKE_WINDOWS_EXPORT_ALL_SYMBOLS=ON `
                -S . -B build-$arch
          if ($LASTEXITCODE -ne 0) { Write-Error "cmake configure failed"; exit 1 }
          cmake --build build-$arch --config Release --target ViGEmClientShared --verbose
          if ($LASTEXITCODE -ne 0) { Write-Error "cmake build failed"; exit 1 }
          # The shared target's OUTPUT_NAME is ViGEmClient and SUFFIX is .dll;
          # the file lands at build-<arch>/Release/ViGEmClient.dll regardless
          # of size (a properly built minimal C client lib is ~30-50 KB).
          $dllPath = "build-$arch/Release/ViGEmClient.dll"
          if (-not (Test-Path $dllPath)) {
            Write-Host "build tree (.dll / .lib / .def):"
            Get-ChildItem -Recurse build-$arch -Include '*.dll','*.lib','*.def' -ErrorAction SilentlyContinue |
              Select-Object FullName, Length |
              Format-Table -AutoSize
            Write-Error "ViGEmClient.dll not produced at expected path: $dllPath"
            exit 1
          }
          $dll = Get-Item $dllPath
          Write-Host "produced: $($dll.FullName)  $($dll.Length) bytes"
          # Sanity-check exports: the bridge's DllImport requires vigem_alloc,
          # vigem_connect, vigem_target_add, and vigem_target_x360_update at
          # minimum. Run dumpbin /EXPORTS, parse, and fail loudly if any are
          # missing. This catches the empty-exports regression at build time
          # instead of waiting for the e2e step to surface a runtime miss.
          $dumpbin = (Get-Command dumpbin -ErrorAction SilentlyContinue).Source
          if (-not $dumpbin) {
            $dumpbin = (Get-ChildItem 'C:\Program Files\Microsoft Visual Studio\2022\*\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe' -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          }
          if ($dumpbin) {
            $exportLines = & $dumpbin /EXPORTS $dll.FullName
            $vigemExports = $exportLines | Select-String -Pattern 'vigem_\w+'
            Write-Host "exports matching vigem_*:"
            $vigemExports | ForEach-Object { "  $_" }
            $required = @('vigem_alloc','vigem_connect','vigem_target_add','vigem_target_x360_update','vigem_target_x360_alloc','vigem_disconnect','vigem_free')
            $missing = @()
            foreach ($r in $required) {
              if (-not ($vigemExports -match "\b$r\b")) { $missing += $r }
            }
            if ($missing.Count -gt 0) {
              Write-Error ("Required vigem_* exports missing from DLL: " + ($missing -join ', '))
              exit 1
            }
            Write-Host "all required vigem_* exports present"
          } else {
            Write-Host "WARN: dumpbin not on PATH; skipping export-table sanity check"
          }
          $outName = "vigemclient.${{ matrix.arch }}.dll"
          Copy-Item $dll.FullName "../$outName"
          Write-Host "staged $outName"

      - name: upload ${{ matrix.arch }} dll
        uses: actions/upload-artifact@v4
        with:
          name: vigemclient-${{ matrix.arch }}
          path: vigemclient.${{ matrix.arch }}.dll
          if-no-files-found: error

  build:
    name: build msi (${{ matrix.arch }})
    needs: build-vigemclient
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: derive version
        id: ver
        shell: pwsh
        run: |
          $ref = "${{ github.ref }}"
          if ($ref.StartsWith("refs/tags/")) {
            $tag = $ref.Substring("refs/tags/".Length)
            if ($tag -notmatch '^v(\d+\.\d+\.\d+)$') {
              Write-Error "tag '$tag' is not v<major>.<minor>.<patch>"
              exit 1
            }
            $v = $matches[1]
            $isRelease = "true"
          } else {
            $sha = "${{ github.sha }}".Substring(0,7)
            $v = "0.0.0-$sha"
            $isRelease = "false"
          }
          "version=$v"            | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "is_release=$isRelease" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "version=$v  is_release=$isRelease"

      - name: pull source-built vigemclient dll
        uses: actions/download-artifact@v4
        with:
          name: vigemclient-${{ matrix.arch }}
          path: src/
      # Overwrites the vendored src/vigemclient.<arch>.dll (and, for x64
      # only, the vendored src/vigemclient.dll used by direct script
      # invocation) with the CI source-build. This guarantees the MSI
      # ships bytes we built ourselves from a pinned upstream commit.

      - name: install WiX v3
        shell: pwsh
        run: |
          choco install wixtoolset -y --no-progress
          $wixBin = 'C:\Program Files (x86)\WiX Toolset v3.14\bin'
          if (-not (Test-Path $wixBin)) {
            $wixBin = (Get-ChildItem 'C:\Program Files (x86)\WiX Toolset v3.*' -Directory | Select-Object -First 1).FullName + '\bin'
          }
          echo "$wixBin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: build msi
        shell: pwsh
        working-directory: installer
        run: |
          .\build.ps1 -Arch ${{ matrix.arch }}

      - name: compute sha256
        id: sha
        shell: pwsh
        run: |
          $msi = "installer/DualSenseXBridge-${{ matrix.arch }}.msi"
          $hash = (Get-FileHash $msi -Algorithm SHA256).Hash.ToLower()
          "sha256=$hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: assemble release bundle
        shell: pwsh
        run: |
          $v = '${{ steps.ver.outputs.version }}'
          $arch = '${{ matrix.arch }}'
          $bundle = "DualSenseXBridge-$v-$arch"
          New-Item -ItemType Directory -Path $bundle | Out-Null
          Copy-Item installer/DualSenseXBridge-$arch.msi $bundle/
          Copy-Item QUICKSTART.md                        $bundle/
          Copy-Item README.md                            $bundle/
          Copy-Item LICENSE                              $bundle/
          Copy-Item -Recurse manifests                   $bundle/
          @"
          DualSense XBridge $v ($arch)
          ============================

          MSI installer + winget manifests + quickstart guide.

          Install (admin PowerShell):
              winget install --manifest manifests

          Or run the MSI directly:
              msiexec /i DualSenseXBridge-$arch.msi /passive

          SHA256(DualSenseXBridge-$arch.msi) = ${{ steps.sha.outputs.sha256 }}
          "@ | Out-File -FilePath "$bundle/INSTALL.txt" -Encoding utf8
          Compress-Archive -Path $bundle -DestinationPath "$bundle.zip"

      - name: upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: DualSenseXBridge-${{ steps.ver.outputs.version }}-${{ matrix.arch }}
          path: DualSenseXBridge-${{ steps.ver.outputs.version }}-${{ matrix.arch }}.zip
          if-no-files-found: error

  e2e-test:
    name: e2e (xinput state assertions)
    needs: build-vigemclient
    runs-on: windows-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: pull source-built x64 vigemclient dll
        uses: actions/download-artifact@v4
        with:
          name: vigemclient-x64
          path: src/
      # Drop the CI-built copy in place as vigemclient.dll so the bridge's
      # DllImport literal resolves to source-built bytes, not the vendored
      # Costura-extracted binary in the repo.
      - name: install source-built dll as vigemclient.dll
        shell: pwsh
        run: |
          Copy-Item -Force src/vigemclient.x64.dll src/vigemclient.dll
          Get-FileHash src/vigemclient.dll -Algorithm SHA256 | Format-List

      - name: install ViGEmBus (official Nefarius installer)
        shell: pwsh
        run: |
          # The choco vigembus package lays down driver files but on
          # github-hosted windows-latest doesn't always create the bus
          # PnP device, leaving vigem_connect failing. The official
          # multi-arch installer handles both steps.
          $ver = '1.22.0'
          $url = "https://github.com/nefarius/ViGEmBus/releases/download/v$ver/ViGEmBus_${ver}_x64_x86_arm64.exe"
          $exe = "$env:RUNNER_TEMP\ViGEmBus_setup.exe"
          Write-Host "Downloading $url"
          Invoke-WebRequest -Uri $url -OutFile $exe -UseBasicParsing
          Write-Host "Running $exe /quiet ..."
          $p = Start-Process -FilePath $exe -ArgumentList '/quiet','/norestart' -Wait -PassThru
          Write-Host "exit code: $($p.ExitCode)"
          # Trigger a PnP enumeration so the bus device appears without a reboot
          pnputil /scan-devices | Out-Null
          Start-Sleep -Seconds 3
          $vigem = Get-PnpDevice -PresentOnly -ErrorAction SilentlyContinue |
                   Where-Object { $_.InstanceId -like 'ROOT\\VIGEM*' -or $_.FriendlyName -like '*ViGEm*' -or $_.Manufacturer -like '*Nefarius*' } |
                   Select-Object -First 5
          if ($vigem) {
            $vigem | Select-Object Status, Problem, FriendlyName, InstanceId | Format-List
          } else {
            Write-Host "WARN: no ViGEm-related PnP node visible after install + rescan"
            Get-PnpDevice -PresentOnly -ErrorAction SilentlyContinue |
              Where-Object { $_.InstanceId -like 'ROOT\\*' } |
              Select-Object InstanceId, FriendlyName, Status |
              Format-Table -AutoSize
          }

      - name: run e2e suite
        shell: pwsh
        run: |
          try {
            .\tests\e2e.ps1
          } finally {
            Write-Host ""
            Write-Host "===== bridge.log tail (post-e2e diagnostic) ====="
            $log = Join-Path $env:ProgramData 'dualsense-xbridge\bridge.log'
            if (Test-Path $log) {
              Get-Content $log -Tail 40
            } else {
              Write-Host "(bridge.log not found at $log)"
            }
          }

  release:
    name: publish github release
    needs: [build, e2e-test]
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: derive version from tag
        id: ver
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -notmatch '^v(\d+\.\d+\.\d+)$') { Write-Error "tag '$tag' invalid"; exit 1 }
          "version=$($matches[1])" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: download all bundle artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: DualSenseXBridge-*
          path: bundles/
          merge-multiple: true

      - name: list bundles + hashes
        shell: pwsh
        run: |
          $v = '${{ steps.ver.outputs.version }}'
          Get-ChildItem bundles/ | Format-Table Name, Length

      - name: create github release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bundles/DualSenseXBridge-${{ steps.ver.outputs.version }}-x64.zip
            bundles/DualSenseXBridge-${{ steps.ver.outputs.version }}-arm64.zip
          generate_release_notes: true
          body: |
            ## Architectures

            - **x64** -- tested. Recommended for most Windows hosts.
            - **arm64** -- built from source in CI; **not** hardware-tested
              by the maintainers. Reports welcome on Snapdragon X / Surface
              Pro X / Copilot+ PCs.

            ## Quick install (admin PowerShell)

            ```powershell
            winget install Nefarius.ViGEmBus
            winget install Nefarius.HidHide
            # then run the matching MSI from this release:
            msiexec /i DualSenseXBridge-x64.msi /passive
            # or for arm64:
            msiexec /i DualSenseXBridge-arm64.msi /passive
            ```

            See `QUICKSTART.md` inside each zip for the full Warzone setup walkthrough.
